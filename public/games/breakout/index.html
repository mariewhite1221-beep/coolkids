<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Breakout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 14px;
    }
    .badge {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .canvas-container {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #020617;
    }
    canvas {
      display: block;
      cursor: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #ec4899;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div style="color: #ec4899; font-weight: 800;">🧱 BREAKOUT</div>
    <div style="display: flex; gap: 8px;">
      <div class="badge">LIVES: <span id="lives-el" style="color: #f43f5e;">❤❤❤</span></div>
      <div class="badge">SCORE: <span id="score-el" style="color: #38bdf8;">0</span></div>
      <div class="badge">BEST: <span id="best-el" style="color: #eab308;">0</span></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="c" width="480" height="420"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title" style="font-size: 28px; font-weight: 800; color: #ec4899;">NEON BREAKOUT</h2>
      <p id="overlay-desc" style="color: #94a3b8; font-size: 14px;">Destroy all blocks to win!</p>
      <button id="start-btn" class="btn">START GAME</button>
    </div>
  </div>

  <div class="hint">Move mouse/finger or [Left/Right Arrow Keys] to move paddle</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives-el');
    const scoreEl = document.getElementById('score-el');
    const bestEl = document.getElementById('best-el');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const startBtn = document.getElementById('start-btn');

    let best = parseInt(localStorage.getItem('breakout_best') || '0', 10);
    bestEl.textContent = best;

    let score = 0;
    let lives = 3;
    let isPlaying = false;

    const paddle = {
      w: 80,
      h: 12,
      x: 200,
      speed: 8
    };

    let ball = {
      x: 240,
      y: 350,
      vx: 4,
      vy: -4,
      radius: 6
    };

    const rowColors = ['#f43f5e', '#f97316', '#eab308', '#10b981', '#06b6d4'];
    const rowPoints = [50, 40, 30, 20, 10];
    const rows = 5;
    const cols = 8;
    const brickW = 52;
    const brickH = 16;
    const brickPadding = 6;
    const offsetTop = 40;
    const offsetLeft = 12;

    let bricks = [];
    let particles = [];

    let audioCtx = null;
    function sound(freq, type = 'sine', duration = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initBricks() {
      bricks = [];
      for (let r = 0; r < rows; r++) {
        bricks[r] = [];
        for (let c = 0; c < cols; c++) {
          bricks[r][c] = {
            x: offsetLeft + c * (brickW + brickPadding),
            y: offsetTop + r * (brickH + brickPadding),
            status: 1,
            color: rowColors[r],
            points: rowPoints[r]
          };
        }
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          color,
          alpha: 1,
          size: Math.random() * 3 + 2
        });
      }
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = canvas.height - 40;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
      ball.vy = -4.5;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      updateLives();
      initBricks();
      paddle.x = canvas.width / 2 - paddle.w / 2;
      resetBall();
    }

    function updateLives() {
      let str = '';
      for (let i = 0; i < lives; i++) str += '❤';
      livesEl.textContent = str || '0';
    }

    function update() {
      if (!isPlaying) return;

      // Keyboard paddle move
      if (keys['ArrowLeft'] || keys['KeyA']) {
        paddle.x = Math.max(0, paddle.x - paddle.speed);
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);
      }

      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall collision
      if (ball.x + ball.radius >= canvas.width) {
        ball.x = canvas.width - ball.radius;
        ball.vx *= -1;
        sound(400);
      } else if (ball.x - ball.radius <= 0) {
        ball.x = ball.radius;
        ball.vx *= -1;
        sound(400);
      }

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
        sound(400);
      }

      // Paddle collision
      if (
        ball.y + ball.radius >= canvas.height - 25 - paddle.h &&
        ball.y - ball.radius <= canvas.height - 25 &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        ball.y = canvas.height - 25 - paddle.h - ball.radius;
        const hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const speed = Math.min(8, Math.hypot(ball.vx, ball.vy) * 1.02);
        ball.vx = speed * hitPoint;
        ball.vy = -Math.sqrt(Math.max(4, speed * speed - ball.vx * ball.vx));
        sound(550, 'triangle');
      }

      // Brick collision
      let allCleared = true;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            allCleared = false;
            if (
              ball.x + ball.radius > b.x &&
              ball.x - ball.radius < b.x + brickW &&
              ball.y + ball.radius > b.y &&
              ball.y - ball.radius < b.y + brickH
            ) {
              b.status = 0;
              ball.vy *= -1;
              score += b.points;
              scoreEl.textContent = score;
              if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('breakout_best', best);
              }
              sound(650 + r * 60, 'square');
              createParticles(b.x + brickW / 2, b.y + brickH / 2, b.color);
            }
          }
        }
      }

      // Win check
      if (allCleared) {
        isPlaying = false;
        overlayTitle.textContent = 'YOU WIN!';
        overlayDesc.textContent = `All Bricks Cleared! Score: ${score}`;
        startBtn.textContent = 'PLAY AGAIN';
        overlay.classList.remove('hidden');
      }

      // Bottom fall
      if (ball.y - ball.radius > canvas.height) {
        lives--;
        updateLives();
        sound(200, 'sawtooth', 0.2);
        if (lives <= 0) {
          isPlaying = false;
          overlayTitle.textContent = 'GAME OVER';
          overlayDesc.textContent = `Final Score: ${score}`;
          startBtn.textContent = 'TRY AGAIN';
          overlay.classList.remove('hidden');
        } else {
          resetBall();
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(b.x, b.y, brickW, brickH, 3);
            ctx.fill();
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(b.x, b.y, brickW, 3);
          }
        }
      }

      // Paddle
      const pGrad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
      pGrad.addColorStop(0, '#ec4899');
      pGrad.addColorStop(1, '#a855f7');
      ctx.fillStyle = pGrad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, canvas.height - 25 - paddle.h, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    // Mouse & touch control
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mouseX - paddle.w / 2));
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, touchX - paddle.w / 2));
    }, { passive: false });

    startBtn.addEventListener('click', () => {
      resetGame();
      isPlaying = true;
      overlay.classList.add('hidden');
    });

    initBricks();
  </script>
</body>
</html>
