<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxy Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 10px 12px;
      font-weight: 700;
      font-size: 14px;
    }
    .canvas-wrap {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #8b5cf6;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .touch-controls {
      display: none;
      margin-top: 10px;
      gap: 16px;
    }
    @media (max-pointer: coarse), (max-width: 600px) {
      .touch-controls { display: flex; }
    }
    .t-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 700;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div style="color: #a78bfa; font-weight: 800;">👾 GALAXY INVADERS</div>
    <div style="display: flex; gap: 12px;">
      <div>LIVES: <span id="lives-el" style="color: #10b981;">❤❤❤</span></div>
      <div>SCORE: <span id="score-el" style="color: #38bdf8;">0</span></div>
      <div>BEST: <span id="best-el" style="color: #f59e0b;">0</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="480" height="420"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title" style="font-size: 26px; font-weight: 800; color: #a78bfa;">GALAXY INVADERS</h2>
      <p id="overlay-msg" style="color: #94a3b8; font-size: 14px;">Repel alien forces with your laser cannon!</p>
      <button id="start-btn" class="btn">ENGAGE</button>
    </div>
  </div>

  <div class="touch-controls">
    <button class="t-btn" id="t-left">◀ LEFT</button>
    <button class="t-btn" id="t-fire" style="background: #8b5cf6;">🔥 FIRE</button>
    <button class="t-btn" id="t-right">RIGHT ▶</button>
  </div>

  <div class="hint">[A / D] or [Left / Right] to steer • [Spacebar] to Fire</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const livesEl = document.getElementById('lives-el');
    const scoreEl = document.getElementById('score-el');
    const bestEl = document.getElementById('best-el');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    let best = parseInt(localStorage.getItem('invaders_best') || '0', 10);
    bestEl.textContent = best;

    let isPlaying = false;
    let score = 0;
    let lives = 3;
    let player = { x: 220, y: 385, w: 32, h: 18, speed: 5 };
    let playerLasers = [];
    let alienLasers = [];
    let aliens = [];
    let alienDir = 1;
    let alienSpeed = 0.8;
    let stepTimer = 0;
    let stars = [];

    // Init stars
    for (let i = 0; i < 40; i++) {
      stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 0.5 + 0.2 });
    }

    let audioCtx = null;
    function beep(freq, duration = 0.08, type = 'square') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 50 + c * 48,
            y: 40 + r * 34,
            w: 26,
            h: 20,
            type: r,
            alive: true
          });
        }
      }
      alienDir = 1;
      alienSpeed = 0.9;
    }

    function fireLaser() {
      if (!isPlaying) return;
      if (playerLasers.length < 2) {
        playerLasers.push({ x: player.x + player.w / 2 - 2, y: player.y - 6, w: 4, h: 10 });
        beep(880, 0.06);
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = score;
      updateLives();
      player.x = 220;
      playerLasers = [];
      alienLasers = [];
      initAliens();
    }

    function updateLives() {
      let str = '';
      for (let i = 0; i < lives; i++) str += '❤';
      livesEl.textContent = str || '0';
    }

    function update() {
      if (!isPlaying) return;

      // Player move
      if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed);
      if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed);

      // Player lasers
      for (let i = playerLasers.length - 1; i >= 0; i--) {
        const l = playerLasers[i];
        l.y -= 7;
        if (l.y < -10) {
          playerLasers.splice(i, 1);
          continue;
        }

        // Alien hit check
        for (let a of aliens) {
          if (a.alive && l.x > a.x && l.x < a.x + a.w && l.y > a.y && l.y < a.y + a.h) {
            a.alive = false;
            playerLasers.splice(i, 1);
            score += (4 - a.type) * 20;
            scoreEl.textContent = score;
            if (score > best) {
              best = score;
              bestEl.textContent = best;
              localStorage.setItem('invaders_best', best);
            }
            beep(320, 0.1, 'sawtooth');
            break;
          }
        }
      }

      // Move aliens
      let hitEdge = false;
      const liveAliens = aliens.filter(a => a.alive);
      if (liveAliens.length === 0) {
        // Next wave!
        initAliens();
        alienSpeed += 0.4;
        return;
      }

      liveAliens.forEach(a => {
        a.x += alienDir * alienSpeed;
        if (a.x <= 10 || a.x + a.w >= canvas.width - 10) hitEdge = true;
      });

      if (hitEdge) {
        alienDir *= -1;
        liveAliens.forEach(a => {
          a.y += 12;
          if (a.y + a.h >= player.y) {
            lives = 0;
            updateLives();
            gameOver('ALIENS OVERRAN DEFENSES');
          }
        });
      }

      // Alien fire
      if (Math.random() < 0.025 && alienLasers.length < 3 && liveAliens.length > 0) {
        const shooter = liveAliens[Math.floor(Math.random() * liveAliens.length)];
        alienLasers.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 8 });
      }

      // Alien lasers move
      for (let i = alienLasers.length - 1; i >= 0; i--) {
        const l = alienLasers[i];
        l.y += 4;
        if (l.y > canvas.height) {
          alienLasers.splice(i, 1);
          continue;
        }

        // Hit player
        if (
          l.x > player.x &&
          l.x < player.x + player.w &&
          l.y > player.y &&
          l.y < player.y + player.h
        ) {
          alienLasers.splice(i, 1);
          lives--;
          updateLives();
          beep(150, 0.25, 'sawtooth');
          if (lives <= 0) {
            gameOver('DEFENSE DESTROYED');
          }
        }
      }

      // Starfield
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      });
    }

    function gameOver(reason) {
      isPlaying = false;
      overlayTitle.textContent = 'GAME OVER';
      overlayMsg.textContent = `${reason}! Score: ${score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#64748b';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, 1.5, 1.5);
      });

      // Player cannon
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y + 6, player.w, player.h - 6, 3);
      ctx.fill();
      ctx.fillRect(player.x + player.w / 2 - 3, player.y, 6, 8);

      // Player lasers
      ctx.fillStyle = '#38bdf8';
      playerLasers.forEach(l => {
        ctx.fillRect(l.x, l.y, l.w, l.h);
      });

      // Alien lasers
      ctx.fillStyle = '#f43f5e';
      alienLasers.forEach(l => {
        ctx.fillRect(l.x, l.y, l.w, l.h);
      });

      // Aliens
      const alienColors = ['#f43f5e', '#f59e0b', '#8b5cf6', '#06b6d4'];
      aliens.forEach(a => {
        if (!a.alive) return;
        ctx.fillStyle = alienColors[a.type] || '#ec4899';
        // Sprite shape
        ctx.beginPath();
        ctx.roundRect(a.x, a.y, a.w, a.h, 4);
        ctx.fill();
        // Eyes
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(a.x + 5, a.y + 5, 4, 4);
        ctx.fillRect(a.x + a.w - 9, a.y + 5, 4, 4);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        fireLaser();
      }
    });
    window.addEventListener('keyup', e => {
      keys[e.code] = false;
    });

    startBtn.addEventListener('click', () => {
      resetGame();
      isPlaying = true;
      overlay.classList.add('hidden');
    });

    document.getElementById('t-left').addEventListener('pointerdown', () => { keys['ArrowLeft'] = true; });
    document.getElementById('t-left').addEventListener('pointerup', () => { keys['ArrowLeft'] = false; });
    document.getElementById('t-right').addEventListener('pointerdown', () => { keys['ArrowRight'] = true; });
    document.getElementById('t-right').addEventListener('pointerup', () => { keys['ArrowRight'] = false; });
    document.getElementById('t-fire').addEventListener('click', fireLaser);

    initAliens();
  </script>
</body>
</html>
