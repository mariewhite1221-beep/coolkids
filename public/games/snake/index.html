<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
    }
    .scores {
      display: flex;
      gap: 16px;
    }
    .score-badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .score-val { color: #10b981; font-weight: 700; }
    .canvas-container {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background: #020617;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 28px; color: #f8fafc; font-weight: 800; }
    .btn {
      background: #10b981;
      color: #022c22;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.96); }
    .controls-hint {
      margin-top: 12px;
      color: #94a3b8;
      font-size: 13px;
      display: flex;
      gap: 12px;
    }
    .d-pad {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 50px);
      gap: 6px;
      margin-top: 14px;
    }
    @media (max-pointer: coarse), (max-width: 600px) {
      .d-pad { display: grid; }
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .d-btn:active { background: #334155; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: #10b981; font-weight: 800;">🐍 SNAKE</div>
    <div class="scores">
      <div class="score-badge">SCORE: <span id="score" class="score-val">0</span></div>
      <div class="score-badge">BEST: <span id="high-score" class="score-val">0</span></div>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title">SNAKE CLASSIC</h2>
      <p id="overlay-msg" style="color: #94a3b8; font-size: 14px;">Use Arrow Keys or WASD</p>
      <button id="start-btn" class="btn">PLAY GAME</button>
    </div>
  </div>

  <div class="controls-hint">
    <span>[Arrow Keys / WASD] Navigate</span>
    <span>[Space] Pause</span>
    <span>[R] Restart</span>
  </div>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" id="btn-up">▲</button>
    <div></div>
    <button class="d-btn" id="btn-left">◀</button>
    <button class="d-btn" id="btn-down">▼</button>
    <button class="d-btn" id="btn-right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = 20;
    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('snake_high_score') || '0', 10);
    let gameLoop = null;
    let isPaused = false;
    let isGameOver = false;
    let isPlaying = false;

    highScoreEl.textContent = highScore;

    // Simple Web Audio sounds
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      scoreEl.textContent = score;
      isGameOver = false;
      isPaused = false;
      placeFood();
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function update() {
      if (isPaused || isGameOver || !isPlaying) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake_high_score', highScore);
        }
        playBeep(520, 'triangle', 0.1);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
      ctx.arc(fx, fy, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Food shine
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981'; // Head
        } else {
          const alpha = Math.max(0.4, 1 - index / snake.length * 0.5);
          ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
        }
        ctx.beginPath();
        ctx.roundRect(
          segment.x * GRID_SIZE + 1.5,
          segment.y * GRID_SIZE + 1.5,
          GRID_SIZE - 3,
          GRID_SIZE - 3,
          index === 0 ? 5 : 3
        );
        ctx.fill();
      });
    }

    function gameOver() {
      isGameOver = true;
      isPlaying = false;
      clearInterval(gameLoop);
      playBeep(180, 'sawtooth', 0.25);
      overlayTitle.textContent = 'GAME OVER';
      overlayMsg.textContent = `Your Score: ${score}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function startGame() {
      initGame();
      isPlaying = true;
      overlay.classList.add('hidden');
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(() => {
        update();
        draw();
      }, 100);
      draw();
    }

    function setDirection(newDx, newDy) {
      if (!isPlaying || isPaused) return;
      if (newDx !== 0 && dx !== -newDx) {
        nextDx = newDx;
        nextDy = 0;
      } else if (newDy !== 0 && dy !== -newDy) {
        nextDx = 0;
        nextDy = newDy;
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        setDirection(0, -1);
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        setDirection(0, 1);
      } else if (['ArrowLeft', 'KeyA'].includes(e.code)) {
        e.preventDefault();
        setDirection(-1, 0);
      } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
        e.preventDefault();
        setDirection(1, 0);
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (!isPlaying) {
          startGame();
        } else {
          isPaused = !isPaused;
          if (isPaused) {
            overlayTitle.textContent = 'PAUSED';
            overlayMsg.textContent = 'Press Space to Resume';
            startBtn.textContent = 'RESUME';
            overlay.classList.remove('hidden');
          } else {
            overlay.classList.add('hidden');
          }
        }
      } else if (e.code === 'KeyR') {
        startGame();
      }
    });

    startBtn.addEventListener('click', () => {
      if (isPaused) {
        isPaused = false;
        overlay.classList.add('hidden');
      } else {
        startGame();
      }
    });

    document.getElementById('btn-up').addEventListener('click', () => setDirection(0, -1));
    document.getElementById('btn-down').addEventListener('click', () => setDirection(0, 1));
    document.getElementById('btn-left').addEventListener('click', () => setDirection(-1, 0));
    document.getElementById('btn-right').addEventListener('click', () => setDirection(1, 0));

    draw();
  </script>
</body>
</html>
