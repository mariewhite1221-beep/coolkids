<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Desert Dino Run</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      padding: 10px 14px;
      font-weight: 700;
    }
    .canvas-wrap {
      position: relative;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #84cc16;
      color: #1a2e05;
      border: none;
      font-weight: 700;
      font-size: 15px;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .controls-panel {
      display: flex;
      gap: 14px;
      margin-top: 12px;
    }
    .c-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div style="color: #a3e635; font-weight: 800;">🦖 DESERT DINO</div>
    <div style="display: flex; gap: 14px;">
      <div>SCORE: <span id="score-el" style="color: #38bdf8; font-family: monospace; font-size: 16px;">00000</span></div>
      <div>HI: <span id="hi-el" style="color: #f59e0b; font-family: monospace; font-size: 16px;">00000</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="c" width="600" height="260"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="title" style="font-size: 26px; font-weight: 800; color: #a3e635;">DESERT DINO RUN</h2>
      <p id="msg" style="color: #94a3b8; font-size: 14px;">Press Space or Tap to Jump over obstacles</p>
      <button id="start-btn" class="btn">START RUN</button>
    </div>
  </div>

  <div class="controls-panel">
    <button class="c-btn" id="btn-jump">⬆ JUMP</button>
    <button class="c-btn" id="btn-duck">⬇ DUCK</button>
  </div>

  <div class="hint">[Space] or [Up Arrow] to Jump • [Down Arrow] to Duck</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score-el');
    const hiEl = document.getElementById('hi-el');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const msgEl = document.getElementById('msg');
    const startBtn = document.getElementById('start-btn');

    let hiScore = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    hiEl.textContent = String(hiScore).padStart(5, '0');

    let isPlaying = false;
    let score = 0;
    let speed = 6;
    let frame = 0;

    const GROUND_Y = 210;

    let dino = {
      x: 50,
      y: GROUND_Y - 44,
      w: 40,
      h: 44,
      vy: 0,
      isGrounded: true,
      isDucking: false
    };

    let obstacles = [];
    let clouds = [
      { x: 100, y: 50, speed: 0.5 },
      { x: 340, y: 70, speed: 0.7 },
      { x: 500, y: 40, speed: 0.4 }
    ];

    let audioCtx = null;
    function beep(freq, duration = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function jump() {
      if (!isPlaying) {
        startRun();
        return;
      }
      if (dino.isGrounded) {
        dino.vy = -12.5;
        dino.isGrounded = false;
        beep(480);
      }
    }

    function duck(isDown) {
      dino.isDucking = isDown;
      if (isDown && !dino.isGrounded) {
        dino.vy += 6; // fast fall
      }
    }

    function startRun() {
      score = 0;
      speed = 6;
      frame = 0;
      obstacles = [];
      dino.y = GROUND_Y - 44;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function gameOver() {
      isPlaying = false;
      beep(150, 0.2);
      if (score > hiScore) {
        hiScore = score;
        hiEl.textContent = String(hiScore).padStart(5, '0');
        localStorage.setItem('dino_hi', hiScore);
      }
      titleEl.textContent = 'GAME OVER';
      msgEl.textContent = `Score: ${score} | High: ${hiScore}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      // Score increment
      if (frame % 5 === 0) {
        score++;
        scoreEl.textContent = String(score).padStart(5, '0');
        if (score % 100 === 0) beep(800, 0.1);
        if (score % 250 === 0) speed += 0.5;
      }

      // Physics
      dino.vy += 0.72; // Gravity
      dino.y += dino.vy;

      const currentH = dino.isDucking && dino.isGrounded ? 26 : 44;
      if (dino.y >= GROUND_Y - currentH) {
        dino.y = GROUND_Y - currentH;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      // Obstacle spawner
      if (frame % Math.max(60, Math.floor(130 - speed * 4)) === 0 && Math.random() < 0.8) {
        const isBird = score > 150 && Math.random() < 0.35;
        if (isBird) {
          obstacles.push({
            x: canvas.width,
            y: GROUND_Y - 52, // Requires ducking or jumping depending on height
            w: 36,
            h: 22,
            type: 'bird'
          });
        } else {
          const typeCount = Math.floor(Math.random() * 2) + 1;
          obstacles.push({
            x: canvas.width,
            y: GROUND_Y - 40,
            w: 18 * typeCount,
            h: 40,
            type: 'cactus'
          });
        }
      }

      // Move obstacles
      const currentW = dino.isDucking && dino.isGrounded ? 50 : 36;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed;

        // Collision check
        if (
          dino.x + 6 < o.x + o.w &&
          dino.x + currentW - 6 > o.x &&
          dino.y + 4 < o.y + o.h &&
          dino.y + currentH > o.y
        ) {
          gameOver();
          return;
        }

        if (o.x + o.w < -20) {
          obstacles.splice(i, 1);
        }
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = canvas.width + 40;
      });
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#1e293b';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 16, 0, Math.PI * 2);
        ctx.arc(c.x + 18, c.y - 6, 20, 0, Math.PI * 2);
        ctx.arc(c.x + 36, c.y, 16, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Dino
      ctx.fillStyle = '#84cc16';
      if (dino.isDucking && dino.isGrounded) {
        // Ducking dino
        ctx.beginPath();
        ctx.roundRect(dino.x, dino.y, 50, 26, 6);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#020617';
        ctx.fillRect(dino.x + 40, dino.y + 4, 4, 4);
      } else {
        // Normal standing/jumping dino
        ctx.beginPath();
        ctx.roundRect(dino.x, dino.y, 36, 44, 6);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#020617';
        ctx.fillRect(dino.x + 24, dino.y + 6, 4, 4);
        // Snout
        ctx.fillStyle = '#84cc16';
        ctx.fillRect(dino.x + 20, dino.y + 4, 18, 14);
      }

      // Obstacles
      obstacles.forEach(o => {
        if (o.type === 'bird') {
          ctx.fillStyle = '#f43f5e';
          ctx.beginPath();
          ctx.ellipse(o.x + o.w / 2, o.y + o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          // Beak
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.h / 2);
          ctx.lineTo(o.x - 8, o.y + o.h / 2 + 3);
          ctx.lineTo(o.x, o.y + o.h / 2 + 6);
          ctx.fill();
        } else {
          // Cactus
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.roundRect(o.x, o.y, o.w, o.h, 4);
          ctx.fill();
        }
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        duck(true);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        duck(false);
      }
    });

    startBtn.addEventListener('click', startRun);
    canvas.addEventListener('pointerdown', jump);

    document.getElementById('btn-jump').addEventListener('click', jump);
    document.getElementById('btn-duck').addEventListener('pointerdown', () => duck(true));
    document.getElementById('btn-duck').addEventListener('pointerup', () => duck(false));
  </script>
</body>
</html>
